<!DOCTYPE html>
<!--
  lineups.html - Boss sestavy: 20 hráčů na každého bosse (GET /api/lineups), náhrada listu „Boss sestavy“.
  Slot je jméno hráče, nebo "Hráč (Classa)" když má hrát jinou postavu než main (Glasolo (Paladin)) – dropdown
  nabízí každého hráče jednou za každou classu, kterou má v rosteru. Buňky mají barvu classy zvolené postavy; hráč s absencí na datum bosse je červený (nepřijde) /
  oranžový (přijde dýl), duplicita v sestavě má červené jméno, hráč mimo roster šedou. Přihlášený admin
  upravuje přímo v tabulce (dropdown hráčů, datum) a ukládá PUT /api/lineups. web/build.mjs (Cloudflare build → dist/) kopíruje do kořene repa.
  Stejná data čte tools/raidplan/raidplan.py --boss (přes /api/lineups.csv) a bot docházky.
-->
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boss sestavy – Eternal Shadows</title>
<link rel="icon" href="assets/images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  :root { --wrap: 1700px; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin: 0 0 8px; font-size: 13px; color: var(--muted); }
  .bar .sp { flex: 1; }
  .bar input { background: var(--surface2); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font: inherit; width: 11rem; }
  .bar label#alldate { color: var(--ink); font-weight: 600; } .bar label#alldate input { padding: 5px 12px; font-size: 13px; width: auto; margin-left: 6px; }
  .bar .btn, .bar .btn-outline { padding: 7px 16px; font-size: 13.5px; }
  #msg { min-height: 1.2em; font-weight: 600; } #msg.ok { color: var(--accent); } #msg.err { color: var(--dps); }
  /* všech 9 bossů na jednu obrazovku: pevné sloupce přes celou šířku, těsné buňky, hlavička na 3 krátké řádky */
  .wrap { overflow-x: auto; }
  table.lu { table-layout: fixed; width: 100%; border-collapse: separate; border-spacing: 1px 1px; font-size: 12px; }
  .lu th, .lu td { padding: 1px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lu th { text-align: left; vertical-align: top; text-transform: none; letter-spacing: 0; line-height: 1.3; padding-bottom: 3px; }
  .lu th:first-child { width: 1.5rem; padding: 0; }
  .edit .lu th { overflow: visible; }   /* datum: kalendář input nesmí být oříznutý */
  .lu th .boss { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink-strong); }
  .lu th .links a { color: var(--accent); text-decoration: none; font-size: 11px; font-weight: 400; margin-right: 7px; }
  .lu th .meta { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; }
  .lu th .meta .cnt.full { color: var(--accent); }
  .lu td.no { color: var(--muted); font-size: 10.5px; text-align: right; padding: 0 3px 0 0; }
  .lu td.slot { border-radius: 3px; color: #111; font-weight: 600; line-height: 1.4; }
  .lu td.slot.empty { background: rgba(255,255,255,.04); color: var(--muted); font-weight: 400; }
  .lu td.slot.absent { background: #E06666 !important; text-decoration: line-through; }
  .lu td.slot.late { background: #F6B26B !important; }
  .lu td.slot.unknown { background: #666 !important; color: #eee; }
  .lu td.slot.dup { color: #b00000 !important; }
  .lu td.slot small { font-size: 9.5px; font-weight: 500; opacity: .8; margin-left: 3px; }
  .edit .lu td.slot select, .edit .lu th input[type=date] { width: 100%; background: transparent; color: inherit; border: 0; border-bottom: 1px dashed rgba(0,0,0,.35); font: inherit; font-weight: 600; padding: 0; cursor: pointer; }
  .edit .lu td.slot.empty select { color: var(--muted); border-bottom-color: var(--line); }
  .edit .lu th input[type=date] { display: block; color: var(--ink); border-bottom-color: var(--line); font-weight: 400; font-size: 11px; width: 100%; margin-top: 1px; }
  .lu select option { background: var(--surface2); color: var(--ink); }
  .mini { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 4px; padding: 0 6px; cursor: pointer; font: inherit; font-size: 10.5px; margin-top: 2px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .mini:hover { color: var(--ink-strong); border-color: var(--accent); }
  .legend { color: var(--muted); font-size: 12px; margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .legend span i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 6px 0 0; }
  /* RaidPlan.io sync (GitHub Actions raidplan.yml) */
  .sync { border: 1px solid var(--line); border-radius: 10px; background: var(--surface2); padding: 8px 12px; margin: 0 0 10px; font-size: 13px; color: var(--muted); }
  .sync .row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .sync .row + .row { margin-top: 6px; }
  .sync b.t { color: var(--ink-strong); margin-right: 4px; }
  .sync .bosses { display: inline-flex; flex-wrap: wrap; gap: 3px; }
  .sync .bosses label { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; cursor: pointer; font-size: 12px; color: var(--muted); user-select: none; }
  .sync .bosses label.on { background: var(--accent); border-color: var(--accent); color: #07110c; font-weight: 600; }
  .sync .bosses input { display: none; }
  .sync input[type=text] { background: var(--surface3); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; width: 22rem; max-width: 100%; }
  .sync label.chk { color: var(--ink); cursor: pointer; } .sync label.chk input { vertical-align: -1px; margin-right: 3px; }
  .sync .btn { padding: 6px 16px; font-size: 13px; }
  .sync .btn[disabled] { opacity: .5; cursor: default; }
  #syncmsg { font-weight: 600; } #syncmsg.ok { color: var(--accent); } #syncmsg.err { color: var(--dps); }
  .sync .last b { color: var(--ink); font-weight: 600; } .sync .last b.bad { color: var(--dps); } .sync .last b.good { color: var(--accent); }
  .sync .last a { color: var(--accent); text-decoration: none; }
  .sync details { display: inline; } .sync details summary { cursor: pointer; color: var(--accent); display: inline; }
  .sync pre { margin: 6px 0 0; padding: 8px 10px; background: var(--ground, #0a0c0b); border: 1px solid var(--line); border-radius: 6px; font-size: 11.5px; line-height: 1.45; max-height: 22rem; overflow: auto; white-space: pre-wrap; color: var(--ink); }
  .sync pre .warn { color: #F6B26B; } .sync pre .man { color: var(--dps); font-weight: 600; } .sync pre .swap { color: var(--accent); }
</style>
</head>
<body>

<header class="site-header">
<div class="container">
<!-- @nav -->
</div>
</header>
<script src="assets/js/es-auth.js"></script>

<div class="container">
<div class="page-content" id="page">
<div class="heading-section">
  <h4><em>Boss</em> sestavy</h4>
</div>

<div class="bar">
  <span id="status">Načítám…</span>
  <a href="comps.html" title="nejhranější sestavy top guild podle raider.io (první killy)">Meta sestavy top guild ↗</a>
  <span class="sp"></span>
  <span id="msg"></span>
  <label id="alldate" title="nadřazené datum: nastaví datum všem bossům najednou (datum u bosse jde pak změnit zvlášť, zpět se nepropisuje)" hidden>Datum všech bossů <input type="date" id="alldateInput"></label>
  <span id="adminbox" hidden>
    <button class="btn-outline" id="edit" type="button">Upravit</button>
    <button class="btn" id="save" type="button" hidden>Uložit</button>
    <button class="btn-outline" id="cancel" type="button" hidden>Zrušit</button>
  </span>
  <span id="loginhint" hidden>Úpravy: přihlas se vpravo nahoře.</span>
</div>

<div class="sync" id="sync" hidden>
  <div class="row" id="syncctl" hidden>
    <b class="t">RaidPlan.io</b>
    <span class="bosses" id="syncbosses" title="které plány synchronizovat"></span>
    <input type="text" id="syncchanges" placeholder="výměny navíc: Akka-Meslock, Miky=Hase" title="A-B vymění místa a přiřazení dvou hráčů, Old=New přejmenuje; víc změn odděl čárkou">
    <label class="chk" title="jen ukáže, co by se změnilo – nic se do plánů neuloží"><input type="checkbox" id="syncdry"> jen náhled</label>
    <button class="btn" id="syncbtn" type="button" title="přejmenuje hráče v plánech na raidplan.io podle sestav (GitHub Actions, ~1 min)">Synchronizovat plány</button>
    <span id="syncmsg"></span>
  </div>
  <div class="row last" id="synclast"></div>
</div>

<div class="wrap"><table class="lu" id="lu"><thead></thead><tbody></tbody></table></div>
<div class="legend"><span><i style="background:#E06666"></i>nepřijde (omluvenka na datum bosse)</span><span><i style="background:#F6B26B"></i>přijde dýl</span><span><i style="background:#666"></i>není v rosteru</span><span style="color:#e05050">červené jméno = dvakrát v sestavě</span></div>
<p class="hint" id="hint"></p>
</div>
</div>

<footer>
  <p>Eternal Shadows · Burning Blade EU</p>
  <p class="credit">Design: <a href="https://templatemo.com/tm-579-cyborg-gaming" target="_blank" rel="noopener">TemplateMo</a> (Cyborg Gaming, CC BY 4.0)</p>
</footer>

<script>
(function () {
  var API_BASE = /(^|\.)workers\.dev$/.test(location.hostname) ? "" : "https://eternal-shadows.vitek-poor.workers.dev";
  var CZ = ["ne", "po", "út", "st", "čt", "pá", "so"];
  var CLASS_COLOR = { "death knight": "#C41E3A", "demon hunter": "#A330C9", druid: "#FF7C0A", evoker: "#33937F", hunter: "#AAD372", mage: "#3FC7EB",
                      monk: "#00FF98", paladin: "#F48CBA", priest: "#FFFFFF", rogue: "#FFF468", shaman: "#0070DD", warlock: "#8788EE", warrior: "#C69B3A" };
  var $ = function (s) { return document.querySelector(s); };
  var state = { token: window.esAuth ? esAuth.token() : null, roster: [], bosses: [], size: 20, abs: {}, edit: false, draft: null };
  if (window.esAuth) esAuth.onChange(function (t) { state.token = t; if (!t) { state.edit = false; state.draft = null; } render(); });
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function msg(ok, t) { var m = $("#msg"); m.className = ok ? "ok" : "err"; m.textContent = t || ""; }
  function nk(s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim(); }
  function czDate(s) { if (!s) return ""; var d = new Date(s + "T00:00:00"); return CZ[d.getDay()] + " " + d.getDate() + "." + (d.getMonth() + 1) + "." + d.getFullYear(); }
  // slot "Glasolo" = main postava, "Glasolo (Paladin)" = postava dané classy (alt); splitSlot vrací { name, cls }
  function splitSlot(slot) {
    var m = /^(.*?)\s*\(([^()]+)\)\s*$/.exec(String(slot || "").trim());
    return m ? { name: m[1].trim(), cls: m[2].trim() } : { name: String(slot || "").trim(), cls: "" };
  }
  function slotValue(name, cls, mainCls) { return nk(cls) && nk(cls) !== nk(mainCls) ? name + " (" + cls + ")" : name; }
  function playerInfo(slot) {
    var sp = splitSlot(slot), k = nk(sp.name), p = state.roster.filter(function (x) { return nk(x.name) === k; })[0];
    if (!p) return null;
    var main = p.characters.filter(function (c) { return c.main; })[0] || p.characters[0] || {};
    var ch = sp.cls ? p.characters.filter(function (c) { return nk(c.class) === nk(sp.cls); })[0] : main;
    return { player: p, name: p.name, cls: (ch || main).class || "", role: (ch || main).role || "", bench: p.bench,
             alt: !!ch && ch !== main, badClass: sp.cls && !ch ? sp.cls : "" };
  }

  function load() {
    return Promise.all([
      fetch(API_BASE + "/api/roster", { cache: "no-store" }).then(function (r) { return r.json(); }),
      fetch(API_BASE + "/api/lineups", { cache: "no-store" }).then(function (r) { return r.json(); })
    ]).then(function (res) {
      if (!res[0].ok || !res[1].ok) throw new Error(res[0].error || res[1].error || "chyba");
      state.roster = res[0].players || []; state.bosses = res[1].bosses || []; state.size = res[1].size || 20;
      $("#status").textContent = res[1].updated ? "upraveno " + new Date(res[1].updated).toLocaleString("cs-CZ") : "";
      var dates = state.bosses.map(function (b) { return b.date; }).filter(Boolean).sort();
      if (!dates.length) { state.abs = {}; render(); return; }
      return fetch(API_BASE + "/api/absence?from=" + dates[0] + "&to=" + dates[dates.length - 1], { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (a) {
        state.abs = {}; (a.marks || []).forEach(function (m) { state.abs[nk(m.player) + "|" + m.date] = m.type; }); render();
      });
    }).catch(function (err) { $("#status").textContent = "Data se nenačetla: " + err.message; });
  }

  // bodyOnly = jen řádky (změna data v hlavičce nesmí překreslit <input type=date>, jinak se při psaní ztratí fokus)
  function render(bodyOnly) {
    var list = state.edit ? state.draft : state.bosses;
    $("#page").classList.toggle("edit", state.edit);
    var head = "<tr><th></th>" + list.map(function (b, bi) {
      var n = b.slots.filter(Boolean).length;
      return "<th><span class=\"boss\">" + esc(b.no + " " + b.name) + "</span><span class=\"links\"><a href=\"" + esc(b.planView) + "\" target=\"_blank\" rel=\"noopener\">Plán ↗</a><a href=\"" + esc(b.guideUrl.replace(/^https?:\/\/[^/]+\/raid/, "raid.html")) + "\">Taktika ↗</a></span>" +
        (state.edit ? '<input type="date" value="' + esc(b.date) + '" data-b="' + bi + '" data-f="date">' + (bi > 0 ? '<br><button class="mini" type="button" data-b="' + bi + '" data-act="copyprev" title="zkopírovat sestavu předchozího bosse">← kopírovat ' + esc(list[bi - 1].no) + "</button>" : "")
                    : '<span class="meta">' + (b.date ? esc(czDate(b.date)) : "bez data") + ' · <span class="cnt' + (n === state.size ? " full" : "") + '">' + n + "/" + state.size + "</span></span>") +
        "</th>";
    }).join("") + "</tr>";
    var rows = [];
    for (var i = 0; i < state.size; i++) {
      rows.push('<tr><td class="no">' + (i + 1) + "</td>" + list.map(function (b, bi) {
        var slot = b.slots[i] || "", sp = splitSlot(slot), name = sp.name, info = slot ? playerInfo(slot) : null, cls = [], why = "", style = "";
        if (!slot) cls.push("empty");
        else {
          if (!info) { cls.push("unknown"); why = "není v rosteru"; }
          else {
            style = "background:" + (CLASS_COLOR[info.cls.toLowerCase()] || "#999");
            if (info.badClass) why = "postava classy " + info.badClass + " není v rosteru – bere se main";
            else if (info.alt) why = "hraje alt: " + info.cls;
          }
          if (b.slots.filter(function (s) { return nk(splitSlot(s).name) === nk(name); }).length > 1) { cls.push("dup"); why = "dvakrát"; }
          var a = b.date ? state.abs[nk(name) + "|" + b.date] : null;
          if (a === "absent") { cls.push("absent"); why = "nepřijde"; } else if (a === "late") { cls.push("late"); why = "přijde dýl"; }
        }
        var inner = state.edit
          ? '<select data-b="' + bi + '" data-s="' + i + '"><option value="">–</option>' + optionsFor(slot) + "</select>"
          : esc(name || "–") + (sp.cls ? "<small>" + esc(sp.cls) + "</small>" : "");
        return '<td class="slot ' + cls.join(" ") + '" style="' + style + '"' + (why ? ' title="' + esc(why) + '"' : "") + ">" + inner + "</td>";
      }).join("") + "</tr>");
    }
    if (!bodyOnly) $("#lu thead").innerHTML = head;
    $("#lu tbody").innerHTML = rows.join("");
    $("#adminbox").hidden = !state.token; $("#loginhint").hidden = !!state.token;
    $("#alldate").hidden = !state.edit;
    if (state.edit && !bodyOnly) { var ds = list.map(function (b) { return b.date; }); $("#alldateInput").value = ds.length && ds.every(function (d) { return d === ds[0]; }) ? ds[0] || "" : ""; }
    $("#edit").hidden = state.edit; $("#save").hidden = !state.edit; $("#cancel").hidden = !state.edit;
    $("#hint").textContent = state.edit ? "Vyber hráče v každém slotu (dropdown; hráč s více classami je v seznamu jednou za každou – „Glasolo (Paladin)“ = hraje alta), nastav datum raidu u bosse (nebo „Datum všech bossů“ nahoře najednou – jednotlivé datum jde pak ještě upravit), nebo zkopíruj sestavu předchozího bosse. Nic se neuloží, dokud nedáš Uložit. Po uložení dej „Synchronizovat plány“, aby se změny propsaly do RaidPlan.io."
      : "Sestavy čte tools/raidplan/raidplan.py --boss (přejmenování markerů v RaidPlan.io) a bot docházky na Discordu. Datum bosse určuje, čí omluvenky se v jeho sloupci ukážou.";
  }
  // jeden plochý seznam podle abecedy (roster i lavička dohromady); hráč s postavami více class je tam jednou za každou classu
  var optCache = null, optValues = null;
  function optionsFor(sel) {
    if (!optCache) {
      var items = [];
      state.roster.forEach(function (p) {
        var main = p.characters.filter(function (c) { return c.main; })[0] || p.characters[0] || {}, seen = {};
        var classes = p.characters.map(function (c) { return c.class || ""; }).filter(function (c) { var k = nk(c); if (!k || seen[k]) return false; seen[k] = true; return true; });
        if (!classes.length) { items.push({ value: p.name, label: p.name, name: p.name, main: true }); return; }
        classes.forEach(function (c) {
          var isMain = nk(c) === nk(main.class);
          items.push({ value: slotValue(p.name, c, main.class), label: classes.length > 1 ? p.name + " (" + c + ")" : p.name, name: p.name, main: isMain });
        });
      });
      items.sort(function (a, b) { return a.name.localeCompare(b.name, "cs") || (a.main ? -1 : b.main ? 1 : a.label.localeCompare(b.label, "cs")); });
      optValues = {}; items.forEach(function (it) { optValues[it.value] = true; });
      optCache = items.map(function (it) { return '<option value="' + esc(it.value) + '">' + esc(it.label) + "</option>"; }).join("");
    }
    var html = optCache;
    if (sel && !optValues[sel]) html += '<option value="' + esc(sel) + '">' + esc(sel) + (state.roster.some(function (p) { return nk(p.name) === nk(splitSlot(sel).name); }) ? "" : " (mimo roster)") + "</option>";
    return html.replace('value="' + esc(sel) + '"', 'value="' + esc(sel) + '" selected');
  }
  // nadřazené datum → všem bossům; opačně (změna u bosse) se do něj nepropisuje
  $("#alldateInput").addEventListener("change", function () {
    if (!state.edit) return;
    var v = $("#alldateInput").value; state.draft.forEach(function (b) { b.date = v; }); render();
  });
  document.addEventListener("change", function (ev) {
    var t = ev.target; if (!state.edit || t.id === "alldateInput") return;
    var b = state.draft[+t.dataset.b]; if (!b) return;
    if (t.dataset.f === "date") { b.date = t.value; render(true); }      // absence ve sloupci podle nového data
    else if (t.dataset.s != null) { b.slots[+t.dataset.s] = t.value; render(); }
  });
  document.addEventListener("click", function (ev) {
    var btn = ev.target.closest("button[data-act=copyprev]"); if (!btn || !state.edit) return;
    var bi = +btn.dataset.b; state.draft[bi].slots = state.draft[bi - 1].slots.slice(); render();
  });
  $("#edit").addEventListener("click", function () { state.draft = JSON.parse(JSON.stringify(state.bosses)); state.edit = true; msg(true, ""); render(); });
  $("#cancel").addEventListener("click", function () { state.edit = false; state.draft = null; render(); });
  $("#save").addEventListener("click", function () {
    $("#save").disabled = true; msg(true, "Ukládám…");
    fetch(API_BASE + "/api/lineups", { method: "PUT", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + state.token },
      body: JSON.stringify({ bosses: state.draft.map(function (b) { return { no: b.no, date: b.date, slots: b.slots }; }) }) })
      .then(function (r) { return r.json().then(function (d) { d._status = r.status; return d; }); }).then(function (d) {
        if (d._status === 401) { esAuth.logout(); throw new Error("Přihlášení vypršelo – přihlas se znovu."); }
        if (!d.ok) throw new Error(d.error || "uložení selhalo");
        state.edit = false; state.draft = null; msg(true, "✔ Uloženo (" + d.bosses + " bossů)."); return load();
      }).catch(function (err) { msg(false, "⚠ " + err.message); }).then(function () { $("#save").disabled = false; });
  });
  window.addEventListener("beforeunload", function (ev) { if (state.edit) { ev.preventDefault(); ev.returnValue = ""; } });

  // ---- RaidPlan.io sync: POST /api/lineups/sync → GitHub Actions raidplan.yml (raidplan.py --boss); log from /sync-status
  var sync = { status: null, timer: null, bossesBuilt: false };
  function syncMsg(ok, t) { var m = $("#syncmsg"); m.className = ok ? "ok" : "err"; m.textContent = t || ""; }
  function syncBosses() {
    if (sync.bossesBuilt || !state.bosses.length) return;
    sync.bossesBuilt = true;
    $("#syncbosses").innerHTML = '<label class="on" title="všechny plány"><input type="checkbox" value="all" checked>vše</label>' + state.bosses.map(function (b) {
      return '<label title="' + esc(b.name) + '"><input type="checkbox" value="' + esc(b.no) + '">' + esc(b.no) + "</label>";
    }).join("");
  }
  $("#syncbosses").addEventListener("change", function (ev) {
    var t = ev.target, labels = $("#syncbosses").querySelectorAll("label");
    if (t.value === "all" && t.checked) labels.forEach(function (l) { var i = l.querySelector("input"); if (i.value !== "all") i.checked = false; });
    else if (t.value !== "all" && t.checked) $("#syncbosses input[value=all]").checked = false;
    if (!$("#syncbosses").querySelector("input:checked")) $("#syncbosses input[value=all]").checked = true;
    labels.forEach(function (l) { l.classList.toggle("on", l.querySelector("input").checked); });
  });
  function fmtLog(log) {
    return esc(log).split("\n").map(function (l) {
      if (/PLACE MANUALLY|REMOVE MANUALLY|Save rejected|Error|Traceback|Cannot|missing/.test(l)) return '<span class="man">' + l + "</span>";
      if (/WARNING|NOT 20/.test(l)) return '<span class="warn">' + l + "</span>";
      if (/^\s+swap:|-&gt;/.test(l)) return '<span class="swap">' + l + "</span>";
      return l;
    }).join("\n");
  }
  function renderSync() {
    var s = sync.status, r = s && s.result, d = s && s.dispatch;
    $("#sync").hidden = !state.token && !r;
    $("#syncctl").hidden = !state.token;
    if (state.token) syncBosses();
    $("#syncbtn").disabled = !!(s && s.running);
    var html = "";
    if (s && s.running) html = "<b>⏳ Synchronizace běží</b> (spuštěno " + esc(new Date(d.at).toLocaleTimeString("cs-CZ")) + (d.dryRun ? ", jen náhled" : "") + ", plány " + esc(d.bosses.join(" ")) + (d.changes ? ", změny: " + esc(d.changes) : "") + ") – výsledek se objeví sám…";
    else if (r) {
      html = "Poslední " + (r.dryRun ? "náhled" : "synchronizace") + " " + esc(new Date(r.finishedAt).toLocaleString("cs-CZ")) + ': <b class="' + (r.ok ? "good" : "bad") + '">' + (r.ok ? "✔ OK" : "⚠ selhala (kód " + r.exitCode + ")") + "</b>" +
        " · plány " + esc(r.bosses.join(" ")) + (r.changes.length ? " · změny: " + esc(r.changes.join(", ")) : "") + (/PLACE MANUALLY|REMOVE MANUALLY/.test(r.log) ? ' · <b class="bad">něco je třeba doplnit ručně (viz log)</b>' : "") +
        (r.runUrl ? ' · <a href="' + esc(r.runUrl) + '" target="_blank" rel="noopener">běh ↗</a>' : "") + " · <details><summary>log</summary><pre>" + fmtLog(r.log || "(prázdný log)") + "</pre></details>";
    } else if (state.token) html = "Zatím žádná synchronizace. Tlačítko přejmenuje hráče v plánech na raidplan.io podle sestav (kdo vypadl → kdo přibyl, páruje se podle role) a srovná ikony a barvy podle rosteru.";
    $("#synclast").innerHTML = html;
  }
  function loadSync() {
    return fetch(API_BASE + "/api/lineups/sync-status", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (s) {
      if (!s.ok) throw new Error(s.error || "chyba");
      sync.status = s; renderSync();
      clearTimeout(sync.timer);
      if (s.running) sync.timer = setTimeout(loadSync, 8000);
    }).catch(function (err) { $("#synclast").textContent = "Stav synchronizace se nenačetl: " + err.message; });
  }
  $("#syncbtn").addEventListener("click", function () {
    var picked = Array.prototype.map.call($("#syncbosses").querySelectorAll("input:checked"), function (i) { return i.value; });
    var body = { bosses: picked.indexOf("all") >= 0 || !picked.length ? "all" : picked, changes: $("#syncchanges").value.trim(), dryRun: $("#syncdry").checked, reason: "lineups page" };
    if (state.edit) { syncMsg(false, "Nejdřív ulož (nebo zruš) rozpracované úpravy sestav."); return; }
    $("#syncbtn").disabled = true; syncMsg(true, "Spouštím…");
    fetch(API_BASE + "/api/lineups/sync", { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + state.token }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (d) { d._status = r.status; return d; }); }).then(function (d) {
        if (d._status === 401) { esAuth.logout(); throw new Error("Přihlášení vypršelo – přihlas se znovu."); }
        if (!d.ok) throw new Error(d.error || "spuštění selhalo");
        syncMsg(true, d.message || "spuštěno"); if (d.dispatched) $("#syncchanges").value = "";
        return loadSync();
      }).catch(function (err) { syncMsg(false, "⚠ " + err.message); $("#syncbtn").disabled = false; });
  });
  if (window.esAuth) esAuth.onChange(function () { renderSync(); });
  load().then(loadSync);
})();
</script>
</body>
</html>
