name: Sim queue (Raidbots / QE Live)

# Zpracuje frontu simů z databáze (Worker API eternal-shadows, D1): pro každou
# postavu pustí Raidbots Droptimizer (DPS/tank) nebo QE Live (healer), výsledky
# uloží do databáze (stránka Simy) a frontě nahlásí hotový report. Stejný skript
# jako lokálně: tools/roster/sim_runner.py. Spouští ho Worker po každém odeslání
# formuláře (workflow_dispatch, secret GITHUB_TOKEN ve Workeru) a hodinový cron.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   ES_API_TOKEN            token Worker API (= secret API_TOKEN Workeru eternal-shadows) – fronta i výsledky
#   WOWAUDIT_API_KEY        (volitelné) API klíč wowaudit týmu – raidový report se zkusí nahrát i tam
#   RAIDBOTS_STORAGE_STATE  obsah souboru z `python sim_runner.py login --export`
#                           (přihlášení do Raidbots Premium; bez něj běží jako free účet)
#   RAIDBOTS_EMAIL          e-mail + heslo účtu Raidbots (https://www.raidbots.com/auth) –
#   RAIDBOTS_PASSWORD       skript se jimi přihlásí, když session chybí nebo vypršela.
#                           Stačí jedno z toho (session nebo e-mail+heslo); obojí = nejrobustnější.
#   DISCORD_BOT_TOKEN       (volitelné) token Discord bota – zprávy do místností hráčů po dokončení simů
#                           a `discord-rooms` (Discord blokuje bot API z Google, proto to dělá runner)
#   DISCORD_GUILD_ID        (volitelné) ID Discord serveru pro task discord-rooms

on:
  schedule:
    - cron: "17 * * * *"          # každou hodinu
  workflow_dispatch:
    inputs:
      reason:
        description: "Kdo/co spustil (jen do logu)"
        type: string
        default: "manual"
      parallel:
        description: "Kolik simů najednou (prázdné = z configu / 10)"
        type: string
        default: ""
      task:
        description: "sims = zpracovat frontu, discord-rooms = načíst místnosti hráčů do listu Discord, discord-test = testovací zpráva do místnosti"
        type: choice
        options: [sims, discord-rooms, discord-test]
        default: sims
      character:
        description: "(discord-test) postava, pro kterou poslat testovací zprávu"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: sim-queue
  cancel-in-progress: false

jobs:
  sims:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      ES_API_TOKEN: ${{ secrets.ES_API_TOKEN }}
      WOWAUDIT_API_KEY: ${{ secrets.WOWAUDIT_API_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Discord rooms → sheet
        if: inputs.task == 'discord-rooms'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: python tools/roster/sim_runner.py discord-rooms

      - name: Discord test message
        if: inputs.task == 'discord-test'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_TEST_CHARACTER: ${{ inputs.character }}
        run: python tools/roster/sim_runner.py discord-test

      # Levná kontrola fronty před instalací Chromia (ušetří ~1 min při prázdné frontě)
      - name: Check queue
        id: queue
        if: inputs.task != 'discord-rooms' && inputs.task != 'discord-test'
        run: python tools/roster/sim_runner.py pending

      - name: Install Playwright + Chromium
        if: inputs.task != 'discord-rooms' && inputs.task != 'discord-test' && steps.queue.outputs.count != '0'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Restore Raidbots login
        if: inputs.task != 'discord-rooms' && inputs.task != 'discord-test' && steps.queue.outputs.count != '0'
        env:
          RAIDBOTS_STORAGE_STATE: ${{ secrets.RAIDBOTS_STORAGE_STATE }}
          RAIDBOTS_EMAIL: ${{ secrets.RAIDBOTS_EMAIL }}
        run: |
          if [ -n "$RAIDBOTS_STORAGE_STATE" ]; then
            printf '%s' "$RAIDBOTS_STORAGE_STATE" > "$RUNNER_TEMP/raidbots_state.json"
            echo "SIM_STORAGE_STATE=$RUNNER_TEMP/raidbots_state.json" >> "$GITHUB_ENV"
            echo "Raidbots session restored."
          else
            if [ -n "$RAIDBOTS_EMAIL" ]; then
              echo "RAIDBOTS_STORAGE_STATE není nastavený – sim_runner se přihlásí e-mailem a heslem."
            else
              echo "::warning::Ani RAIDBOTS_STORAGE_STATE, ani RAIDBOTS_EMAIL/RAIDBOTS_PASSWORD nejsou nastavené – Raidbots poběží jako free účet (1 sim, pomalá fronta)."
            fi
          fi

      - name: Run sims
        if: inputs.task != 'discord-rooms' && inputs.task != 'discord-test' && steps.queue.outputs.count != '0'
        env:
          SIM_PARALLEL: ${{ inputs.parallel }}
          RAIDBOTS_EMAIL: ${{ secrets.RAIDBOTS_EMAIL }}
          RAIDBOTS_PASSWORD: ${{ secrets.RAIDBOTS_PASSWORD }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python tools/roster/sim_runner.py --headless

      - name: Upload debug screenshots
        if: always() && inputs.task != 'discord-rooms' && inputs.task != 'discord-test' && steps.queue.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: sim-runner-logs
          path: tools/roster/sim_runner_logs/
          if-no-files-found: ignore
          retention-days: 7
