name: Weekly raid attendance report

on:
  schedule:
  # Every day at 18:00 Czech time. GitHub cron is UTC only AND its firings are
  # routinely 1–4 hours late (the old "0 16 / 0 17 UTC + must be 18:xx" gate
  # therefore never posted: the 16:00 firing arrived at 19:51 UTC). So the job
  # fires every 30 minutes from 15:30 UTC to 21:30 UTC and the "gate" step keeps
  # the FIRST firing where it is already 18:00 or later in Europe/Prague and the
  # report has not been posted today yet (per-day marker in the Actions cache).
  - cron: "0,30 15-21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — print the report in the log, do not post to Discord"
        type: boolean
        default: false
      date:
        description: "Pretend today is this date (YYYY-MM-DD), e.g. 2026-09-08"
        type: string
        default: ""
      week_offset:
        description: "0 = week of the next raid day (default), 1 = a week later, -1 = a week earlier"
        type: string
        default: ""

permissions:
  contents: read
  actions: write   # actions/cache save (the "posted today" marker)

concurrency:
  group: attendance-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Time gate (18:00 or later in Europe/Prague; manual runs always pass)
        id: gate
        run: |
          echo "day=$(TZ=Europe/Prague date +%F)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(TZ=Europe/Prague date +%H)" -ge 18 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "It is $(TZ=Europe/Prague date +%H:%M) in Europe/Prague, before 18:00 - skipping this cron firing."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # Scheduled runs: was the report already posted today? (exact-key cache hit = yes)
      - name: Check the "posted today" marker
        id: marker
        if: steps.gate.outputs.run == 'true' && github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .absence-report-posted
          key: absence-report-posted-${{ steps.gate.outputs.day }}
          lookup-only: true

      - name: Decide
        id: go
        run: |
          if [ "${{ steps.gate.outputs.run }}" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.marker.outputs.cache-hit }}" = "true" ]; then
            echo "Report for ${{ steps.gate.outputs.day }} was already posted today - skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.go.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.go.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.go.outputs.run == 'true'
        run: pip install -r tools/attendance/requirements.txt

      - name: Build and send the report
        if: steps.go.outputs.run == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTIONS: ${{ secrets.DISCORD_MENTIONS }}
          # Optional overrides — set as repository *variables* (Settings ->
          # Secrets and variables -> Actions -> Variables) if needed.
          SHEET_ID: ${{ vars.SHEET_ID }}
          SHEET_GID: ${{ vars.SHEET_GID }}
          RAID_WEEKDAYS: ${{ vars.RAID_WEEKDAYS }}
          WEEK_START: ${{ vars.WEEK_START }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          SHOW_NOT_CONFIRMED: ${{ vars.SHOW_NOT_CONFIRMED }}
          MENTION_SECTIONS: ${{ vars.MENTION_SECTIONS }}
          REPORT_TITLE: ${{ vars.REPORT_TITLE }}
          REPORT_LANG: ${{ vars.REPORT_LANG }}
          LINEUP_GID: ${{ vars.LINEUP_GID }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ -n "${{ inputs.week_offset }}" ]; then ARGS="$ARGS --week-offset ${{ inputs.week_offset }}"; fi
          python tools/attendance/attendance.py $ARGS

      # Scheduled run posted → write today's marker so the later cron firings skip.
      - name: Write the "posted today" marker
        if: steps.go.outputs.run == 'true' && github.event_name == 'schedule'
        run: date -u > .absence-report-posted
      - uses: actions/cache/save@v4
        if: steps.go.outputs.run == 'true' && github.event_name == 'schedule'
        with:
          path: .absence-report-posted
          key: absence-report-posted-${{ steps.gate.outputs.day }}
