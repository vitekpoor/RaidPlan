name: Weekly raid attendance report

on:
  schedule:
  # Every day at 18:00 Czech time. GitHub cron is UTC only, so the job fires
  # at both 16:00 and 17:00 UTC and the "gate" step below keeps only the
  # firing where it is 18:00 in Europe/Prague (16 UTC in summer, 17 in winter).
  - cron: "0 16 * * *"
  - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — print the report in the log, do not post to Discord"
        type: boolean
        default: false
      date:
        description: "Pretend today is this date (YYYY-MM-DD), e.g. 2026-09-08"
        type: string
        default: ""
      week_offset:
        description: "0 = week of the next raid day (default), 1 = a week later, -1 = a week earlier"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: attendance-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run only at 18:00 Czech time (DST guard for the two UTC crons)
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(TZ=Europe/Prague date +%H)" = "18" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "It is $(TZ=Europe/Prague date +%H:%M) in Europe/Prague, not 18:xx - skipping this cron firing."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r tools/attendance/requirements.txt

      - name: Build and send the report
        if: steps.gate.outputs.run == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTIONS: ${{ secrets.DISCORD_MENTIONS }}
          # Optional overrides — set as repository *variables* (Settings ->
          # Secrets and variables -> Actions -> Variables) if needed.
          SHEET_ID: ${{ vars.SHEET_ID }}
          SHEET_GID: ${{ vars.SHEET_GID }}
          RAID_WEEKDAYS: ${{ vars.RAID_WEEKDAYS }}
          WEEK_START: ${{ vars.WEEK_START }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          SHOW_NOT_CONFIRMED: ${{ vars.SHOW_NOT_CONFIRMED }}
          MENTION_SECTIONS: ${{ vars.MENTION_SECTIONS }}
          REPORT_TITLE: ${{ vars.REPORT_TITLE }}
          REPORT_LANG: ${{ vars.REPORT_LANG }}
          LINEUP_GID: ${{ vars.LINEUP_GID }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ -n "${{ inputs.week_offset }}" ]; then ARGS="$ARGS --week-offset ${{ inputs.week_offset }}"; fi
          python tools/attendance/attendance.py $ARGS
