name: Nábor (Warcraft Logs → databáze)

# Najde hráče guild, které jsou na realmu v žebříčku raider.io pod námi – mythic žebříček do max_rank a heroic žebříček
# (obsahuje i guildy bez mythic killů) do max_rank_hc: rostery VŠECH jejich first killů (HC + M) z raider.io, raider.io
# profil (frakce, ilvl, aktuální guilda – kdo mezitím odešel do guildy nad námi, vypadne; kontakt), průměrný percentil parsů
# 95+ z Warcraft Logs API jen z aktuálního raidu (diff auto = heroic u všech, mythic navíc u těch, kdo jsou v mythic first-kill
# rosteru; hráčům, kteří prošli, dotáhne chybějící obtížnost) a uloží je přes Worker API do D1 (tabulky scout_guilds,
# scout_players). Zobrazuje admin stránka web/scout.html ("Nábor").
# Spouští se jednou týdně a ručně (stránka přes Worker POST /api/scout/refresh → workflow_dispatch, nebo Run workflow).
# WCL API má limit 3600 bodů/h – auto běh (≈ 35 guild, ~1300 postav) ≈ 8000 bodů, skript čeká na hodinové resety (~2,5 h).
#
# Secrets: WCL_CLIENT_ID + WCL_CLIENT_SECRET (https://www.warcraftlogs.com/api/clients), ES_API_TOKEN (Worker API_TOKEN).

on:
  schedule:
    - cron: "0 5 * * 1"            # pondělí 06:00/07:00 českého času
  workflow_dispatch:
    inputs:
      min_avg:
        description: "Minimální průměrný percentil (heroic nebo mythic)"
        type: string
        default: "95"
      max_rank:
        description: "Do jakého ranku mythic žebříčku guild na serveru se dívat"
        type: string
        default: "20"
      max_rank_hc:
        description: "Do jakého ranku heroic žebříčku (obsahuje i guildy bez mythic killů)"
        type: string
        default: "40"
      diff:
        description: "Obtížnost parsů: auto = heroic u všech + mythic u mythic raiderů (hráčům 95+ dotáhne obě); both = obě u všech; hc; my"
        type: choice
        options: [auto, both, hc, my]
        default: auto
      reason:
        description: "Kdo/co spustil (jen do logu)"
        type: string
        default: "manual"

permissions:
  contents: read

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
      WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
      ES_API_TOKEN: ${{ secrets.ES_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scout players
        run: node tools/recruit/wcl_scout.mjs --min-avg "${{ inputs.min_avg || '95' }}" --max-rank "${{ inputs.max_rank || '20' }}" --max-rank-hc "${{ inputs.max_rank_hc || '40' }}" --diff "${{ inputs.diff || 'auto' }}" --reason "${{ inputs.reason || 'schedule' }}"
