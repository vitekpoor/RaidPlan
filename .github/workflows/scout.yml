name: Nábor (Warcraft Logs → databáze)

# Najde hráče guild, které jsou na serveru v žebříčku progressu pod námi (Eternal Shadows a horší, do max. ranku),
# s průměrným percentilem parsů 95+ na heroicu nebo mythicu (Warcraft Logs API), doplní kontakt z raider.io
# (About, BattleTag, Discord, socials, looking-for-guild profil) a uloží je přes Worker API do D1
# (tabulky scout_guilds, scout_players). Zobrazuje admin stránka web/scout.html ("Nábor").
# Spouští se jednou týdně a ručně (stránka přes Worker POST /api/scout/refresh → workflow_dispatch, nebo Run workflow).
# WCL API má limit 3600 bodů/h – skript podle potřeby čeká na reset, celý běh může trvat až ~2 h.
#
# Secrets: WCL_CLIENT_ID + WCL_CLIENT_SECRET (https://www.warcraftlogs.com/api/clients), ES_API_TOKEN (Worker API_TOKEN).

on:
  schedule:
    - cron: "0 5 * * 1"            # pondělí 06:00/07:00 českého času
  workflow_dispatch:
    inputs:
      min_avg:
        description: "Minimální průměrný percentil (heroic nebo mythic)"
        type: string
        default: "95"
      max_rank:
        description: "Do jakého ranku guild na serveru se dívat (progress)"
        type: string
        default: "20"
      reason:
        description: "Kdo/co spustil (jen do logu)"
        type: string
        default: "manual"

permissions:
  contents: read

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
      WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
      ES_API_TOKEN: ${{ secrets.ES_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scout players
        run: node tools/recruit/wcl_scout.mjs --min-avg "${{ inputs.min_avg || '95' }}" --max-rank "${{ inputs.max_rank || '20' }}" --reason "${{ inputs.reason || 'schedule' }}"
